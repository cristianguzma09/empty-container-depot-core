server:
  port: 8081

spring:
  application:
    name: empty-container-depot-core

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=EmptyContainerDepotDB;encrypt=false;trustServerCertificate=true
    username: ecd_app
    password: EcdApp#2026!

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: dbo
